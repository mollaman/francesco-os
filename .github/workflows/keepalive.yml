name: Keep Supabase alive

on:
  schedule:
    - cron: "17 7 */2 * *"   # ogni 2 giorni alle 7:17 UTC
  workflow_dispatch:          # pulsante "Run workflow" per testarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -1)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js | head -1)
          if [ -z "$KEY" ]; then KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -1); fi
          echo "Progetto: $URL"
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo ""
          echo "OK: database attivo"
