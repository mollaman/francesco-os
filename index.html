<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Francesco OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Francesco OS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg:#0b1120;--card:#131b2e;--card2:#1a243c;--line:#25304b;--txt:#eef2f8;--mut:#8a96af;--acc:#38bdf8;--acc2:#818cf8;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
header{max-width:560px;margin:auto;padding:16px 18px 8px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:27px;margin:0;font-weight:800;letter-spacing:-.02em}
header .sub{color:var(--mut);font-size:13px;margin-top:1px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;padding:0}
.icon-btn svg{width:20px;height:20px}
main{max-width:560px;margin:auto;padding:4px 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.ct h2{font-size:16px;margin:0;font-weight:700}
.lbl{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin:16px 0 8px}
.mut{color:var(--mut);font-size:13px}
.small{font-size:12px}
.link{background:none;border:0;color:var(--acc);font-size:13px;font-weight:600;padding:4px 0}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--mut);white-space:nowrap;font-weight:600}
.pill.ok{color:var(--ok);background:rgba(52,211,153,.12)} .pill.warn{color:var(--warn);background:rgba(251,191,36,.12)} .pill.bad{color:var(--bad);background:rgba(248,113,113,.12)}
.btn{width:100%;padding:14px;border-radius:14px;border:0;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06101f;font-weight:700;font-size:16px;margin-top:8px}
.btn.sec{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.btn.del{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,.5)}
.btn.sm{width:auto;padding:9px 16px;font-size:14px;margin:0;border-radius:12px}
textarea,input,select{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;font-size:16px}
textarea{resize:vertical}
label.f{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.hidden{display:none!important}
.err{color:var(--bad);font-size:14px;margin-top:8px}

/* anelli e barre */
.ring{position:relative;flex:none} .ring .ri{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:6px}

/* hero */
.hero{display:flex;align-items:center;gap:16px}
.stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:-.01em} .stat .l{font-size:12px;color:var(--mut)}
.nudge{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card2);border-radius:12px;margin-top:8px;font-size:14px}
.nudge b{font-weight:600}

/* priorità */
.prio{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.prio:last-child{border-bottom:0}
.prio .n{width:24px;height:24px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--acc);flex:none}

/* check-in */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 10px}
.daynav button{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px;padding:0}
.daynav button:disabled{opacity:.3}
.daynav .c{text-align:center} .daynav .c b{font-size:17px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:10px 4px 9px;text-align:center;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;user-select:none;-webkit-user-select:none;transition:background .12s,border-color .12s}
.tile .e{font-size:23px;line-height:1}
.tile .t{font-size:12px;line-height:1.2;color:var(--mut);font-weight:600}
.tile .hint{font-size:11px;color:var(--mut);opacity:.7}
.tile.on{background:rgba(52,211,153,.13);border-color:rgba(52,211,153,.7)} .tile.on .t{color:var(--txt)}
.tile.neg.on{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.7)}
.mini{display:flex;gap:6px;align-items:center}
.mini button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:15px;line-height:1;padding:0}
.mini .val{font-size:14px;font-weight:800;min-width:20px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h2{font-size:15px;margin:0}
.rate{display:flex;justify-content:space-between;align-items:center;padding:9px 0;gap:8px}
.rate .rl{font-size:14px;font-weight:600} .rate .rl small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.dots{display:flex;gap:6px;flex:none} .dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card2);font-weight:700;padding:0;font-size:14px}
.dots button.sel{background:var(--acc);border-color:var(--acc);color:#04121f}
.savest{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.savest.show{opacity:1} .savest.e{color:var(--bad)}

/* routine */
.rhead{display:flex;align-items:center;gap:14px}
.rhead .tx{flex:1;min-width:0} .rhead .tx b{font-size:16px}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px;margin:12px 0 4px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--mut);font-weight:600}
.seg button.sel{background:var(--card2);color:var(--txt)}
.ri-row{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.ri-row:last-child{border-bottom:0}
.ri-row .e{font-size:19px;width:24px;text-align:center;flex:none}
.ri-row .tt{flex:1;min-width:0;font-size:14px;font-weight:600}
.ri-row .tt small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ri-row.done .tt{color:var(--mut);text-decoration:line-through}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;flex:none;padding:0;color:#06101f;font-weight:900;font-size:14px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.ed{background:none;border:0;color:var(--mut);font-size:16px;padding:4px 6px}
.ctx{white-space:pre-line;font-size:14px;background:var(--bg);border-radius:12px;padding:12px;margin:2px 0 8px;line-height:1.5}

/* liste */
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tx{flex:1;min-width:0} .li .tx b{font-weight:600;font-size:14px;display:block} .li .tx small{color:var(--mut);font-size:12px}
.li .pc{font-weight:800;font-size:15px;flex:none;min-width:42px;text-align:right}
.ins{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.ins:last-child{border-bottom:0}
.ins .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}

/* corpo */
.mtile{background:var(--card2);border-radius:14px;padding:12px}
.mtile .l{font-size:12px;color:var(--mut);font-weight:600}
.mtile .v{font-size:25px;font-weight:800;margin-top:2px;letter-spacing:-.01em} .mtile .v small{font-size:13px;font-weight:600;color:var(--mut)}
.mtile .d{font-size:12px;margin-top:3px}
.chart{position:relative;height:200px}
.hist{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hist div{aspect-ratio:1;border-radius:7px;background:var(--card2);font-size:10px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.75)}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;font-size:10px;color:var(--mut);text-align:center}

.rule{background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(129,140,248,.12));border:1px solid rgba(129,140,248,.35)}
.rule .rt{font-size:18px;font-weight:800;margin:2px 0 6px}
.rule .rb{font-size:14px;line-height:1.5;white-space:pre-line;color:#d6deeb}
.qbtns{display:flex;gap:8px;margin-top:12px}
.qbtns button{flex:1}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,17,32,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 9px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.act{color:var(--acc)}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
#sheet .sh{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
#sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 12px}
#sheet h2{font-size:20px;margin:0 0 4px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ok);color:#052016;padding:10px 18px;border-radius:12px;font-weight:700;display:none;z-index:40}

/* guida */
#guide{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom))}
#guide .gx{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:auto}
#guide .ge{font-size:66px} #guide .gt{font-size:24px;font-weight:800;margin:14px 0}
#guide .timer{font-size:52px;font-weight:800;color:var(--warn);font-variant-numeric:tabular-nums}
</style>
</head>
<body>

<header>
  <div><h1 id="title">Oggi</h1><div class="sub" id="sub"></div></div>
  <button class="icon-btn hidden" id="b-set" data-act="settings" aria-label="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <section id="v-login" class="hidden">
    <div class="card">
      <h2 style="margin:0 0 12px">Accedi</h2>
      <input id="email" type="email" placeholder="email" autocomplete="email"><div style="height:8px"></div>
      <input id="pwd" type="password" placeholder="password (min 6 caratteri)" autocomplete="current-password">
      <button class="btn" id="b-login">Entra</button>
      <button class="btn sec" id="b-signup">Crea account (solo la prima volta)</button>
      <div class="err" id="login-err"></div>
    </div>
  </section>

  <section id="v-today" class="hidden">
    <div class="card" id="t-hero"></div>
    <div class="card" id="t-prio"></div>
    <div class="card" id="t-code"></div>
    <div class="card" id="t-routine"></div>
    <div id="t-day"></div>
    <div id="t-check"></div>
  </section>

  <section id="v-body" class="hidden"><div id="b-body"></div></section>
  <section id="v-goals" class="hidden"><div id="g-body"></div></section>
  <section id="v-trend" class="hidden"><div id="p-body"></div></section>
</main>

<div id="sheet" class="hidden"><div class="sh"><div class="grab"></div><div id="sh-body"></div></div></div>
<div id="guide" class="hidden"></div>
<div class="savest" id="savest"></div>
<div class="toast" id="toast"></div>

<nav id="nav" class="hidden"><div class="in">
  <button data-act="tab" data-v="today" class="act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Oggi</button>
  <button data-act="tab" data-v="body"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Corpo</button>
  <button data-act="tab" data-v="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Obiettivi</button>
  <button data-act="tab" data-v="trend"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Andamento</button>
</div></nav>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
/* ================= BASE ================= */
const C = window.APP_CONFIG || {};
const $ = id => document.getElementById(id);
if (!C.SUPABASE_URL || String(C.SUPABASE_URL).startsWith("INCOLLA")) {
  document.querySelector("main").innerHTML = '<div class="card"><h2>Configurazione mancante</h2><p class="mut">Apri config.js su GitHub e incolla Project URL e Publishable key di Supabase.</p></div>';
  throw new Error("config mancante");
}
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const localISO = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const mondayOf = d => { const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const addDays = (d,n) => { const x=new Date(d); x.setHours(12,0,0,0); x.setDate(x.getDate()+n); return x; };
const dayOfWeek = () => ((new Date().getDay()+6)%7)+1;
const TODAY = () => localISO(new Date());
const fmtD = iso => { const [y,m,d]=iso.split("-"); return `${d}/${m}`; };
const N = v => Number(v)||0;
const fmtN = (v,dec=1) => (v==null||v===""||isNaN(v)) ? "–" : Number(v).toLocaleString("it-IT",{maximumFractionDigits:dec});
const parseNum = s => { s=String(s??"").trim().replace(/\s/g,"").replace(",","."); if (s==="") return null; const n=Number(s); return isNaN(n)?NaN:n; };
const pctS = p => p==null ? "–" : Math.round(p*100)+"%";
const colOf = p => p==null ? "var(--line)" : p>=.9 ? "var(--ok)" : p>=.5 ? "var(--warn)" : "var(--bad)";
const clsOf = p => p==null ? "" : p>=.9 ? "ok" : p>=.5 ? "warn" : "bad";
const toast = (m="Salvato ✓") => { const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(t._t); t._t=setTimeout(()=>t.style.display="none",1600); };
const bar = (p,col) => `<div class="bar"><i style="width:${Math.max(0,Math.min(1,p||0))*100}%;background:${col||colOf(p)}"></i></div>`;
function ring(p,size=88,stroke=9,inner="",color){
  const r=(size-stroke)/2, c=2*Math.PI*r, v=Math.max(0,Math.min(1,p||0)), col=color||colOf(p);
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--card2)" stroke-width="${stroke}" fill="none"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${col}" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-v)}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset .5s"/></svg><div class="ri">${inner}</div></div>`;
}
let UID = null;

/* sheet */
function openSheet(html){ $("sh-body").innerHTML=html; $("sheet").classList.remove("hidden"); $("sheet").querySelector(".sh").scrollTop=0; }
function closeSheet(){ $("sheet").classList.add("hidden"); }
$("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") closeSheet(); });

/* grafici */
const charts = {};
if (window.Chart){ Chart.defaults.color="#8a96af"; Chart.defaults.borderColor="rgba(37,48,75,.6)"; Chart.defaults.font.size=11; Chart.defaults.maintainAspectRatio=false; }
function drawChart(id,cfg){ if(!window.Chart) { const el=$(id); if(el) el.parentElement.innerHTML='<div class="mut">Grafico non disponibile offline.</div>'; return; }
  if(charts[id]) charts[id].destroy(); const el=$(id); if(!el) return; charts[id]=new Chart(el,cfg); }
const refLine = (label,n,val,color) => ({label,data:Array(n).fill(val),borderColor:color,borderDash:[5,5],borderWidth:1.5,pointRadius:0,fill:false});

/* ================= MODELLO ================= */
const AREAS = {corpo:"Corpo & Salute", mente:"Mente & Calma", comunicazione:"Comunicazione", lingue:"Lingue",
  carriera:"Carriera & Business", finanze:"Finanze & Casa", sociale:"Sociale & Stile"};
const AREA_ICON = {corpo:"💪", mente:"🧘", comunicazione:"🗣️", lingue:"🌍", carriera:"🚀", finanze:"🏠", sociale:"🤝"};
const KINDS = {risultato:"Risultato", abitudine:"Abitudine", regola:"Regola", identita:"Identità"};

const CHECK = [
 {sec:"Corpo", items:[
   {k:"wake_730",l:"Sveglia 7:30",i:"⏰",t:"bool"},{k:"gym",l:"Palestra",i:"🏋️",t:"bool"},{k:"tennis",l:"Tennis",i:"🎾",t:"bool"},
   {k:"stretching_min",l:"Stretching",i:"🤸",t:"min",d:10,st:5},{k:"healthy_food",l:"Mangiato bene",i:"🥗",t:"bool"},{k:"other_sport",l:"Altro sport",i:"🏄",t:"bool"} ]},
 {sec:"Mente", items:[
   {k:"meditation_min",l:"Meditazione",i:"🧘",t:"min",d:10,st:5},{k:"reading_min",l:"Lettura",i:"📖",t:"min",d:10,st:5},{k:"journaling",l:"Journaling",i:"✍️",t:"bool"} ]},

function evalT(T, rows, scale=1){
  if (T.ty==="avg"){ const v=rows.map(T.f).filter(x=>x!=null); if(!v.length) return {v:null,p:null};
    const m=v.reduce((a,b)=>a+b,0)/v.length; return {v:Math.round(m*10)/10, p:Math.min(1,m/T.t)}; }
  const v = Math.round(rows.reduce((a,r)=>a+(T.ty==="days"?(T.f(r)?1:0):N(T.f(r))),0)*10)/10;
  if (T.ty==="max") return {v, p: v<=T.t*Math.max(1,scale) ? 1 : Math.max(0, 1-(v-T.t*Math.max(1,scale))/(T.t+3))};
  const goal = T.t*scale; return {v, p: goal<=0 ? 1 : Math.min(1, v/goal)};
}
function weekScore(rows, scale){ const ps=TARGETS.filter(T=>T.ty!=="month").map(T=>evalT(T,rows,T.ty==="max"?1:scale).p).filter(p=>p!=null); return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null; }
const tUnit = T => T.ty==="max" ? `max ${T.t}` : T.ty==="avg" ? `obiettivo ${T.t}` : `/ ${T.t}`;

async function refreshAuto(goals){
  AUTO = {}; const today=new Date(); const links=goals.map(linkOf).filter(Boolean); if(!links.length) return;

    return {rows:rows.filter(r=>r.day>=localISO(s)&&r.day<=localISO(e)), scale:i===0?el/7:1}; }).filter(w=>w.rows.length);
  for (const g of goals){

    if (l==="body"){ const ps=["weight","waist"].map(k=>toTarget(k)).filter(Boolean).map(x=>x.p); if(ps.length){ p=ps.reduce((a,b)=>a+b,0)/ps.length; src="misure corpo"; } }

      if (ps.length){ p=ps.reduce((a,b)=>a+b,0)/ps.length; src="check-in"; } }

  if (bw.length>=2){ const pts=bw.map(x=>({x:new Date(x.day+"T12:00").getTime()/6048e5,y:N(x.weight)})), span=pts[pts.length-1].x-pts[0].x;
    if (span>=2){ const mx=pts.reduce((s,p)=>s+p.x,0)/pts.length, my=pts.reduce((s,p)=>s+p.y,0)/pts.length;
      const slope=pts.reduce((s,p)=>s+(p.x-mx)*(p.y-my),0)/pts.reduce((s,p)=>s+(p.x-mx)**2,0), cur=pts[pts.length-1].y;
      if (cur>SET.w_max){ if (slope<=-0.1){ const dt=addDays(today,Math.round((cur-SET.w_max)/-slope*7));
          out.push(["good",`Peso: ${fmtN(slope,2)} kg a settimana. A questo ritmo arrivi a ${fmtN(SET.w_max)} kg verso ${dt.toLocaleDateString("it-IT",{month:"long",year:"numeric"})}.`]);
          if (slope<-1) out.push(["warn","Perdi più di 1 kg a settimana: rischi di perdere muscolo. Più proteine, deficit meno aggressivo."]); }
        else out.push(["bad",`Peso fermo o in salita e sei ${fmtN(cur-SET.w_max)} kg sopra l'obiettivo. La leva è l'alimentazione, non solo l'allenamento.`]); }
      else if (cur>=SET.w_min) out.push(["good",`Peso nell'intervallo obiettivo.`]); } }
  goals.filter(g=>g.status==="attivo"&&g.kind==="risultato"&&goalProgress(g)<100).map(g=>({g,d:Math.floor((today-new Date(g.updated_at))/864e5)}))
    .filter(x=>x.d>=21).sort((x,y)=>y.d-x.d).slice(0,2)
    .forEach(x=>out.push(["warn",`Fermo da ${x.d} giorni: «${x.g.title}». Prossima azione: ${x.g.next_action||"definiscila"}.`]));
  const ord={bad:0,warn:1,good:2}; return out.sort((x,y)=>ord[x[0]]-ord[y[0]]);
}

function areaScores(rows, goals){
  const mon=mondayOf(new Date()), el=dayOfWeek();
  const weeks=[0,1,2,3].map(i=>{ const s=addDays(mon,-7*i), e=addDays(s,6); return {rows:rows.filter(r=>r.day>=localISO(s)&&r.day<=localISO(e)), scale:i===0?el/7:1}; }).filter(w=>w.rows.length);
  const out={};
  for (const a of Object.keys(AREAS)){
    const ps=[]; TARGETS.filter(T=>T.a===a&&T.ty!=="month").forEach(T=>weeks.forEach(w=>{ const e=evalT(T,w.rows,T.ty==="max"?1:w.scale); if(e.p!=null) ps.push(e.p); }));
    const hab=ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null;
    const gs=goals.filter(g=>g.area===a&&g.status==="attivo"&&g.kind!=="identita");
    const gp=gs.length?gs.reduce((x,g)=>x+goalProgress(g),0)/gs.length/100:null;
    out[a]={s: hab!=null&&gp!=null ? hab*.6+gp*.4 : (hab??gp), hab, gp, n:gs.length};
  }
  return out;
}

/* ================= EVENTI ================= */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return; const a=el.dataset.act, d=el.dataset;
  switch(a){
    case "tab": show(d.v); break;
    case "settings": settingsSheet(); break;
    case "tog": { const it=ITEMS.find(i=>i.k===d.k); state[d.k] = it.t==="min" ? (N(state[d.k])>0?0:it.d) : !state[d.k]; renderCheck(); scheduleSave(); break; }
    case "inc": { e.stopPropagation(); state[d.k]=Math.max(0,Math.round((N(state[d.k])+Number(d.d))*10)/10); renderCheck(); scheduleSave(); break; }
    case "rate": { const n=Number(d.n); state[d.k]=state[d.k]===n?null:n; renderCheck(); if(d.k==="rule_applied") renderCode(); scheduleSave(); break; }
    case "day": { await flushSave(); const nd=localISO(addDays(new Date(curDay+"T12:00"),Number(d.d))); if(nd>TODAY()) break; curDay=nd; await loadDay(); break; }
    case "rt": rtSel=d.rt; rCtx=null; renderRoutine(); break;
    case "rlist": rOpen=!rOpen; localStorage.setItem("fos_rOpen",rOpen?"1":"0"); renderRoutine(); break;
    case "redmode": rEdit=!rEdit; renderRoutine(); break;
    case "rcheck": await toggleItem(Number(d.id)); renderRoutine(); break;
    case "rctx": rCtx = rCtx===Number(d.id) ? null : Number(d.id); renderRoutine(); break;
    case "redit": itemSheet(rItems.find(i=>i.id===Number(d.id))); break;
    case "radd": itemSheet(null,d.rt); break;
    case "guide": startGuide(); break;
    case "cat": pOpen=null; if(!$("sheet").classList.contains("hidden") && d.cat===catSel) break; catSheet(d.cat); break;
    case "popen": if(e.target.closest(".ed")) break; pOpen = pOpen===Number(d.id) ? null : Number(d.id); catSheet(); break;
    case "pedit": pEdit=!pEdit; catSheet(); break;
    case "tabbody": show("body"); break;
    case "addm": measureSheet(null); break;
    case "editm": measureSheet(bodyRows.find(r=>r.id===Number(d.id))); break;
    case "bfinfo": measureSheet(null); break;
    case "bchart": bChart=d.k; document.querySelectorAll('[data-act="bchart"]').forEach(b=>b.classList.toggle("sel",b.dataset.k===bChart)); drawBodyChart(); break;
    case "bhist": bHist=!bHist; loadBody(); break;
    case "btargets": bodyTargetsSheet(); break;
    case "gf": gFilter=d.k; renderGoals(); break;
    case "gopen": goalSheet(Number(d.id)); break;
    case "gedit": goalEditSheet(goals.find(g=>g.id===Number(d.id))); break;
    case "gnew": goalEditSheet(null); break;
    case "gstep": { const g=goals.find(x=>x.id===Number(d.id)); g.steps[Number(d.i)].d=el.checked;
      if (await saveGoal({id:g.id,steps:g.steps,progress:goalProgress(g)})){ goalSheet(g.id); renderGoals(); } break; }
    case "insall": insAll=!insAll; loadTrend(); break;
    case "okopen": okOpen=!okOpen; loadTrend(); break;
    case "review": reviewSheet(); break;
    case "report": doReport(); break;
    case "backup": doBackup(); break;
    case "csv": { const r=await fetchRows(); if(!r.length) return alert("Nessun dato"); download(`checkin-${TODAY()}.csv`,toCSV(r),"text/csv"); break; }
    case "csvbody": { const r=await fetchBody(); if(!r.length) return alert("Nessun dato"); download(`corpo-${TODAY()}.csv`,toCSV(r),"text/csv"); break; }
    case "seedg": { const g=await fetchGoals(); if(g.length && !confirm(`Hai già ${g.length} obiettivi: avrai dei doppioni. Continuare?`)) return; try{ await seedGoals(); toast("Obiettivi caricati ✓"); }catch(x){ alert(x.message); } break; }
    case "seedr": { const it=await fetchItems(); if(it.length && !confirm(`Hai già ${it.length} voci: avrai dei doppioni. Continuare?`)) return; try{ await seedRoutine(); toast("Routine caricata ✓"); loadRoutine(); }catch(x){ alert(x.message); } break; }
    case "logout": await flushSave(); await sb.auth.signOut(); closeSheet(); boot(); break;
  }
});

/* ================= NAVIGAZIONE + LOGIN ================= */
const TITLES={today:"Oggi",body:"Corpo",goals:"Obiettivi",trend:"Andamento"};
let cur="today";
async function show(v){
  await flushSave(); cur=v;
  ["login","today","body","goals","trend"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("act",b.dataset.v===v));
  $("title").textContent=TITLES[v]||"Francesco OS";
  window.scrollTo(0,0);
  if(v==="today"){ curDay=TODAY(); Promise.all([loadDay(),loadRoutine()]).then(()=>{ renderHero(); renderCode(); }); renderPrio(); }
  if(v==="body") loadBody(); if(v==="goals") loadGoals(); if(v==="trend") loadTrend();
}
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  $("sub").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  if(!session){ $("nav").classList.add("hidden"); $("b-set").classList.add("hidden"); $("title").textContent="Francesco OS";
    ["today","body","goals","trend"].forEach(x=>$("v-"+x).classList.add("hidden")); $("v-login").classList.remove("hidden"); return; }
  UID=session.user.id; $("nav").classList.remove("hidden"); $("b-set").classList.remove("hidden");
  rtSel = new Date().getHours()>=16 ? "sera" : "mattina";
  try{ await loadSettings(); }catch(e){}
  try{ const g=await fetchGoals(); if(!g.length) await seedGoals(); }catch(e){}
  try{ const it=await fetchItems(); if(!it.length) await seedRoutine(); }catch(e){}
  show("today");
}
$("b-login").onclick=async()=>{ $("login-err").textContent="";
  const { error }=await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pwd").value });
  if(error) $("login-err").textContent = error.message==="Invalid login credentials" ? "Email o password errate." : error.message; else boot(); };
$("b-signup").onclick=async()=>{ $("login-err").textContent="";
  const { data, error }=await sb.auth.signUp({ email:$("email").value.trim(), password:$("pwd").value });
  if(error) $("login-err").textContent=error.message; else if(!data.session) $("login-err").textContent="Account creato: conferma dalla mail, poi premi Entra."; else boot(); };
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushSave(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
boot();
