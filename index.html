<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Francesco OS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Francesco OS">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--line:#334155;--txt:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
  header{padding:16px 16px 4px;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:20px;margin:0} h2{font-size:17px;margin:0 0 10px}
  .mut{color:var(--mut);font-size:13px}
  main{padding:8px 16px;max-width:560px;margin:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px}
  .row:last-child{border-bottom:0}
  .tog{width:52px;height:30px;border-radius:30px;background:var(--line);position:relative;border:0;flex:none}
  .tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
  .tog.on{background:var(--ok)} .tog.on::after{left:25px}
  .step{display:flex;align-items:center;gap:6px;flex:none}
  .step button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:18px}
  .step span{min-width:38px;text-align:center;font-weight:600}
  .dots{display:flex;gap:6px} .dots button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-weight:600}
  .dots button.sel{background:var(--acc);color:#0f172a;border-color:var(--acc)}
  textarea,input{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
  .btn{width:100%;padding:14px;border-radius:12px;border:0;background:var(--acc);color:#0f172a;font-weight:700;font-size:16px;margin-top:6px}
  .btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
  nav{position:fixed;bottom:0;left:0;right:0;background:#0b1222;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 0;font-size:13px}
  nav button.act{color:var(--acc);font-weight:700}
  .bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .big{font-size:34px;font-weight:800}
  .pill{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--bg);border:1px solid var(--line)}
  .hist{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .hist div{aspect-ratio:1;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:11px;display:flex;align-items:center;justify-content:center}
  .toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--ok);color:#06210f;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:9}
  .hidden{display:none}
  .err{color:var(--bad);font-size:14px;margin-top:8px}
</style>
</head>
<body>

<header><div><h1>Francesco OS</h1><div class="mut" id="sub"></div></div><span class="pill" id="who"></span></header>

<main>
  <!-- LOGIN -->
  <section id="v-login" class="hidden">
    <div class="card">
      <h2>Accedi</h2>
      <input id="email" type="email" placeholder="email" autocomplete="email"><div style="height:8px"></div>
      <input id="pwd" type="password" placeholder="password (min 6 caratteri)" autocomplete="current-password">
      <button class="btn" id="b-login">Entra</button>
      <button class="btn sec" id="b-signup">Crea account (solo la prima volta)</button>
      <div class="err" id="login-err"></div>
    </div>
  </section>

  <!-- OGGI -->
  <section id="v-today" class="hidden">
    <div class="card">
      <div class="row"><b>Giorno</b><input id="day" type="date" style="width:auto"></div>
    </div>
    <div class="card"><h2>Corpo</h2><div id="f-body"></div></div>
    <div class="card"><h2>Mente e calma</h2><div id="f-mind"></div></div>
    <div class="card"><h2>Esecuzione</h2><div id="f-exec"></div></div>
    <div class="card"><h2>Stato</h2>
      <div class="row"><span>Energia</span><div class="dots" data-k="energy"></div></div>
      <div class="row"><span>Giornata</span><div class="dots" data-k="day_quality"></div></div>
      <div style="padding-top:10px"><textarea id="note" rows="3" placeholder="Nota (cosa è andato bene / male)"></textarea></div>
    </div>
    <button class="btn" id="b-save">Salva check-in</button>
    <div class="err" id="save-err"></div>
  </section>

  <!-- SETTIMANA -->
  <section id="v-week" class="hidden">
    <div class="card"><div class="mut" id="w-range"></div><div class="big" id="w-score"></div><div class="mut">aderenza ai target della settimana</div></div>
    <div class="card" id="w-list"></div>
  </section>

  <!-- STORICO -->
  <section id="v-hist" class="hidden">
    <div class="card"><h2>Ultimi 35 giorni</h2><div class="mut" style="margin-bottom:8px">Numero = abitudini chiave fatte (palestra/tennis, stretching, meditazione, spagnolo, priorità)</div><div class="hist" id="h-grid"></div></div>
    <div class="card"><h2>Medie 30 giorni</h2><div id="h-avg"></div></div>
  </section>

  <!-- ALTRO -->
  <section id="v-more" class="hidden">
    <div class="card"><h2>Backup</h2>
      <button class="btn sec" id="b-json">Esporta JSON</button>
      <button class="btn sec" id="b-csv">Esporta CSV (Excel)</button>
    </div>
    <div class="card"><h2>Account</h2><button class="btn sec" id="b-logout">Esci</button></div>
  </section>
</main>

<nav id="nav" class="hidden">
  <button data-v="today" class="act">Oggi</button>
  <button data-v="week">Settimana</button>
  <button data-v="hist">Storico</button>
  <button data-v="more">Altro</button>
</nav>
<div class="toast" id="toast">Salvato ✓</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const C = window.APP_CONFIG || {};
const $ = id => document.getElementById(id);
if (!C.SUPABASE_URL || C.SUPABASE_URL.startsWith("INCOLLA")) {
  document.querySelector("main").innerHTML = '<div class="card"><h2>Configurazione mancante</h2>Apri <b>config.js</b> su GitHub e incolla Project URL e Publishable key di Supabase.</div>';
  throw new Error("config mancante");
}
const sb = window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY);

/* ---------- campi del check-in ---------- */
const FIELDS = {
  body: [["gym","Palestra","bool"],["tennis","Tennis","bool"],["stretching_min","Stretching (min)","num",5]],
  mind: [["meditation_min","Meditazione (min)","num",5],["impulsive","Reazioni impulsive","num",1],["pause_used","Ho fatto la pausa prima di rispondere","bool"]],
  exec: [["priority_done","Priorità del giorno fatta","bool"],["spanish_min","Spagnolo attivo (min)","num",10],["english_pron","Pronuncia inglese","bool"],
         ["house_action","Azione concreta casa","bool"],["project_hours","Ore progetto parallelo","num",0.5],["senior_contact","Contatto senior","bool"]]
};
const ALLKEYS = Object.values(FIELDS).flat().map(f=>f[0]).concat(["energy","day_quality","note"]);
let state = {};

const localISO = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const blank = () => { const s={}; Object.values(FIELDS).flat().forEach(([k,,t])=>s[k]=t==="bool"?false:0); s.energy=null;s.day_quality=null;s.note=""; return s; };

function renderForm(){
  for (const [grp,list] of Object.entries(FIELDS)){
    $("f-"+grp).innerHTML = list.map(([k,l,t,st])=> t==="bool"
      ? `<div class="row"><span>${l}</span><button class="tog ${state[k]?"on":""}" data-k="${k}"></button></div>`
      : `<div class="row"><span>${l}</span><div class="step"><button data-k="${k}" data-d="-${st}">−</button><span id="n-${k}">${state[k]}</span><button data-k="${k}" data-d="${st}">+</button></div></div>`).join("");
  }
  document.querySelectorAll(".dots").forEach(el=>{
    const k=el.dataset.k; el.innerHTML=[1,2,3,4,5].map(n=>`<button class="${state[k]===n?"sel":""}" data-n="${n}">${n}</button>`).join("");
  });
  $("note").value = state.note||"";
}
document.addEventListener("click", e=>{
  const b=e.target.closest("button"); if(!b) return;
  if (b.classList.contains("tog")){ const k=b.dataset.k; state[k]=!state[k]; b.classList.toggle("on",state[k]); }
  else if (b.dataset.d){ const k=b.dataset.k; state[k]=Math.max(0,Math.round((Number(state[k])+Number(b.dataset.d))*10)/10); $("n-"+k).textContent=state[k]; }
  else if (b.dataset.n){ const k=b.parentElement.dataset.k, n=Number(b.dataset.n); state[k]= state[k]===n?null:n; renderForm(); }
  else if (b.dataset.v){ show(b.dataset.v); }
});

async function loadDay(){
  state = blank();
  const { data, error } = await sb.from("daily_checkins").select("*").eq("day",$("day").value).maybeSingle();
  if (error) { $("save-err").textContent = "Errore lettura: "+error.message; }
  if (data) ALLKEYS.forEach(k=>{ if (data[k]!==undefined && data[k]!==null) state[k]= k==="project_hours"?Number(data[k]):data[k]; });
  renderForm();
}
$("day").addEventListener("change", loadDay);

$("b-save").onclick = async ()=>{
  $("save-err").textContent="";
  const { data:{ user } } = await sb.auth.getUser();
  const row = { user_id:user.id, day:$("day").value, updated_at:new Date().toISOString() };
  ALLKEYS.forEach(k=>row[k]=state[k]); row.note=$("note").value.trim()||null;
  const { error } = await sb.from("daily_checkins").upsert(row,{ onConflict:"user_id,day" });
  if (error) { $("save-err").textContent="Errore salvataggio: "+error.message; return; }
  const t=$("toast"); t.style.display="block"; setTimeout(()=>t.style.display="none",1400);
};

/* ---------- settimana ---------- */
const TARGETS = [
  ["Palestra", r=>r.gym?1:0, 3, "volte"],
  ["Tennis", r=>r.tennis?1:0, 2, "volte"],
  ["Stretching (giorni ≥10 min)", r=>r.stretching_min>=10?1:0, 5, "giorni"],
  ["Meditazione (giorni ≥5 min)", r=>r.meditation_min>=5?1:0, 5, "giorni"],
  ["Spagnolo (giorni ≥15 min)", r=>r.spanish_min>=15?1:0, 5, "giorni"],
  ["Pronuncia inglese", r=>r.english_pron?1:0, 3, "sessioni"],
  ["Priorità del giorno", r=>r.priority_done?1:0, 5, "giorni"],
  ["Azioni casa", r=>r.house_action?1:0, 2, "azioni"],
  ["Progetto parallelo", r=>Number(r.project_hours)||0, 3, "ore"],
  ["Contatti senior", r=>r.senior_contact?1:0, 1, "contatti"]
];
async function loadWeek(){
  const now=new Date(), dow=(now.getDay()+6)%7, mon=new Date(now); mon.setDate(now.getDate()-dow);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  $("w-range").textContent=`Settimana ${localISO(mon)} → ${localISO(sun)}`;
  const { data=[], error } = await sb.from("daily_checkins").select("*").gte("day",localISO(mon)).lte("day",localISO(sun));
  if (error){ $("w-list").textContent=error.message; return; }
  let tot=0;
  const html = TARGETS.map(([l,f,t,u])=>{
    const v=Math.round(data.reduce((a,r)=>a+f(r),0)*10)/10, p=Math.min(1,v/t); tot+=p;
    const col = p>=1?"var(--ok)":p>=.5?"var(--warn)":"var(--bad)";
    return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${l}</span><b>${v} / ${t} ${u}</b></div><div class="bar"><i style="width:${p*100}%;background:${col}"></i></div></div>`;
  }).join("");
  const imp=data.reduce((a,r)=>a+(r.impulsive||0),0);
  $("w-list").innerHTML = html + `<div class="row"><span>Reazioni impulsive</span><b style="color:${imp?"var(--warn)":"var(--ok)"}">${imp}</b></div><div class="row"><span>Giorni registrati</span><b>${data.length} / 7</b></div>`;
  $("w-score").textContent = Math.round(tot/TARGETS.length*100)+"%";
}

/* ---------- storico ---------- */
async function loadHist(){
  const from=new Date(); from.setDate(from.getDate()-34);
  const { data=[] } = await sb.from("daily_checkins").select("*").gte("day",localISO(from)).order("day");
  const map=Object.fromEntries(data.map(r=>[r.day,r])); let cells="";
  for(let i=0;i<35;i++){ const d=new Date(from); d.setDate(from.getDate()+i); const r=map[localISO(d)];
    if(!r){ cells+=`<div title="${localISO(d)}" style="opacity:.35">·</div>`; continue; }
    const n=(r.gym||r.tennis?1:0)+(r.stretching_min>=10?1:0)+(r.meditation_min>=5?1:0)+(r.spanish_min>=15?1:0)+(r.priority_done?1:0);
    const bg=["#334155","#7f1d1d","#92400e","#a16207","#15803d","#16a34a"][n];
    cells+=`<div style="background:${bg}" title="${r.day}">${n}</div>`; }
  $("h-grid").innerHTML=cells;
  const last=data.filter(r=>new Date(r.day)>=new Date(Date.now()-30*864e5)), n=last.length||1;
  const avg=k=>(last.reduce((a,r)=>a+(Number(r[k])||0),0)/n).toFixed(1);
  const cnt=k=>last.filter(r=>r[k]).length;
  $("h-avg").innerHTML = [["Giorni registrati",last.length],["Allenamenti (palestra+tennis)",cnt("gym")+cnt("tennis")],["Meditazione media (min/giorno)",avg("meditation_min")],
    ["Spagnolo medio (min/giorno)",avg("spanish_min")],["Reazioni impulsive totali",last.reduce((a,r)=>a+(r.impulsive||0),0)],["Energia media",avg("energy")],["Ore progetto totali",last.reduce((a,r)=>a+Number(r.project_hours||0),0)]]
    .map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join("");
}

/* ---------- backup ---------- */
async function allRows(){ const { data=[] }=await sb.from("daily_checkins").select("*").order("day"); return data; }
function download(name,txt,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type})); a.download=name; a.click(); }
$("b-json").onclick=async()=>download(`francesco-os-${localISO(new Date())}.json`,JSON.stringify(await allRows(),null,2),"application/json");
$("b-csv").onclick=async()=>{ const rows=await allRows(); if(!rows.length) return alert("Nessun dato");
  const cols=Object.keys(rows[0]).filter(c=>c!=="user_id"); const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  download(`francesco-os-${localISO(new Date())}.csv`,"\ufeff"+[cols.join(";"),...rows.map(r=>cols.map(c=>esc(r[c])).join(";"))].join("\n"),"text/csv"); };

/* ---------- navigazione + auth ---------- */
function show(v){
  ["login","today","week","hist","more"].forEach(x=>$("v-"+x).classList.toggle("hidden",x!==v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("act",b.dataset.v===v));
  if(v==="week") loadWeek(); if(v==="hist") loadHist(); window.scrollTo(0,0);
}
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ $("nav").classList.add("hidden"); $("who").textContent=""; show("login"); return; }
  $("who").textContent=session.user.email.split("@")[0]; $("nav").classList.remove("hidden");
  $("sub").textContent=new Date().toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"});
  $("day").value=localISO(new Date()); await loadDay(); show("today");
}
$("b-login").onclick=async()=>{ $("login-err").textContent="";
  const { error }=await sb.auth.signInWithPassword({ email:$("email").value.trim(), password:$("pwd").value });
  if(error) $("login-err").textContent=error.message; else boot(); };
$("b-signup").onclick=async()=>{ $("login-err").textContent="";
  const { data, error }=await sb.auth.signUp({ email:$("email").value.trim(), password:$("pwd").value });
  if(error) $("login-err").textContent=error.message;
  else if(!data.session) $("login-err").textContent="Account creato. Se Supabase chiede conferma, controlla l'email e poi premi Entra.";
  else boot(); };
$("b-logout").onclick=async()=>{ await sb.auth.signOut(); boot(); };

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
boot();
</script>
</body>
</html>
